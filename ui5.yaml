specVersion: '4.0'
metadata:
  name: regesta.cinghy
type: application
framework:
  name: SAPUI5
  version: 1.136.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: sap.tnt
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - /test/**
      - /img/*.svg
      - /img/*.webp
  customTasks:
    - name: ui5-tooling-modules-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-modules-middleware
      afterMiddleware: compression
